<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IurisSearch · Jurisprudencia Penal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/html-docx.min.js"></script>
<style>
/* Los estilos que ya tenías (se mantienen intactos) */
:root{
  --cream:#F8F3E8;--beige:#EDE5D0;--beige-d:#DDD0B8;--coffee-l:#A07850;--coffee:#7B4F2E;--coffee-d:#3D2010;--coffee-h:#5C3D1E;
  --gold:#C49A2A;--gold-l:#E8C96A;--gold-p:#F5E9C0;--ink:#1E140A;--paper:#FDFAF3;
  --ok:#1a6b2e;--ok-bg:#d4f0dc;--ok-b:#a8ddb5;--bad:#922b21;--bad-bg:#fde8e8;--bad-b:#f5b8b8;
  --serif:'Playfair Display',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--coffee)}
h1,h2,h3{font-family:var(--serif);margin:0;color:var(--ink)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--beige)}::-webkit-scrollbar-thumb{background:var(--coffee-l);border-radius:99px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-d{background:var(--coffee-d);color:var(--cream);box-shadow:0 4px 16px rgba(61,32,16,.25)}.btn-d:hover{background:var(--coffee-h)}
.btn-o{border:1px solid var(--gold);color:var(--coffee);background:rgba(196,154,42,.08)}.btn-o:hover{background:var(--gold-p)}
.btn-g{background:var(--gold);color:var(--ink)}.btn-g:hover{background:var(--gold-l)}
.btn-lg{padding:15px 28px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--coffee-l);font-size:14px;display:inline-flex;align-items:center;gap:6px}.link:hover{color:var(--coffee)}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--beige-d);font-size:13px;color:var(--coffee-l);transition:.15s}
.chip.on{border-color:var(--gold);background:var(--gold-p);color:var(--coffee);font-weight:600}

/* Etiquetas */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--coffee-l)}
.mono{font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 10px;border-radius:99px;background:var(--gold-p);color:var(--coffee);border:1px solid var(--beige-d)}
.idtag{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--coffee-d);background:var(--beige);padding:2px 10px;border-radius:8px}
.nivel{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.nivel-A{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-b)}
.nivel-B{background:var(--gold-p);color:var(--coffee);border:1px solid var(--gold-l)}
.nivel-C{background:var(--beige);color:var(--coffee);border:1px solid var(--beige-d)}
.muted{color:var(--coffee-l)}.small{font-size:12.5px}

/* Tarjetas */
.card{background:#fff;border:1px solid var(--beige-d);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(61,32,16,.04);overflow-wrap:anywhere}
.card.hover{cursor:pointer;transition:.15s}.card.hover:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(196,154,42,.15)}
.soft{background:var(--beige);border:1px solid var(--beige-d);border-radius:12px;padding:14px}
.paper{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:18px}
.note{border-left:3px solid var(--gold);padding:8px 14px;color:var(--coffee);font-size:13px;background:var(--paper);border-radius:0 10px 10px 0}
.warn{background:var(--gold-p);border:1px solid var(--gold-l);color:var(--coffee-d);border-radius:12px;padding:10px 14px;font-size:13px}
.err{background:var(--bad-bg);border:1px solid var(--bad-b);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
ul.l{margin:6px 0 0;padding-left:18px}ul.l li{margin:3px 0}
.sec-t{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.kv .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-l)}
.kv .v{font-size:13.5px;font-weight:500;color:var(--coffee-d)}

/* Landing */
.landing{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#F8F3E8 0%,#EDE5D0 60%,#DDD0B8 100%)}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:24px 40px;gap:12px;flex-wrap:wrap}
.lmain{flex:1;display:flex;align-items:center;gap:64px;padding:32px 40px;max-width:1240px;margin:0 auto;width:100%}
.lmain h1{font-size:clamp(36px,5vw,50px);line-height:1.12;margin-bottom:22px}
.lmain h1 em{color:var(--gold)}
.lead{font-size:18px;color:var(--coffee);margin:0 0 30px;max-width:560px}
.stats{display:flex;gap:32px;margin-top:40px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--serif);font-size:24px;color:var(--coffee-d)}
.stats span{font-size:12px;color:var(--coffee-l)}
.hero-img{flex:1;max-width:500px;position:relative}
.hero-img .ph{border-radius:20px;overflow:hidden;box-shadow:0 32px 80px rgba(61,32,16,.2);height:330px;background:linear-gradient(160deg,#5C3D1E,#3D2010)}
.hero-img img{width:100%;height:100%;object-fit:cover;filter:sepia(25%) contrast(1.05);display:block}
.hero-img .cap{position:absolute;left:0;right:0;bottom:0;padding:24px;background:linear-gradient(to top,rgba(61,32,16,.75),transparent);border-radius:0 0 20px 20px;color:var(--cream);font-family:var(--serif);font-style:italic;font-size:17px}
.hero-img .float{position:absolute;top:-22px;right:-20px;background:var(--coffee-d);border-radius:14px;padding:14px 18px;box-shadow:0 8px 32px rgba(0,0,0,.25);color:var(--cream);font-size:13px;max-width:260px;text-align:left;line-height:1.4}
.lfoot{padding:18px 40px;border-top:1px solid var(--beige-d);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--coffee-l);font-size:12px}

/* Logo */
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:36px;height:36px;border-radius:10px;background:var(--coffee-d);display:grid;place-items:center;font-size:19px;flex:none}
.logo .tx{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--coffee-d);line-height:1.1}
.logo .tx em{font-style:normal;color:var(--gold)}
.logo .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--coffee-l)}
.logo.dark .tx{color:var(--cream)}.logo.dark .ic{background:rgba(196,154,42,.2)}.logo.dark .sub{color:rgba(248,243,232,.4)}

/* App */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:244px;flex:none;background:var(--coffee-d);display:flex;flex-direction:column}
.side .top{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.side nav{flex:1;padding:12px;overflow-y:auto}
.side .grp{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(196,154,42,.7);padding:10px 10px 6px}
.nav{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;margin-bottom:2px;color:rgba(248,243,232,.75);font-size:14px;text-align:left}
.nav svg{color:rgba(196,154,42,.65);flex:none}
.nav:hover{background:rgba(196,154,42,.1)}
.nav.on{background:rgba(196,154,42,.18);color:var(--cream);font-weight:600}.nav.on svg{color:var(--gold)}
.side .me{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center;color:var(--cream);font-size:13px}
.side .me .av{width:32px;height:32px;border-radius:50%;background:rgba(196,154,42,.2);display:grid;place-items:center}
main.content{flex:1;overflow-y:auto}
.page{padding:32px;max-width:1040px;margin:0 auto}
.page-h{margin-bottom:26px}
.page-h h1{font-size:28px;margin-top:6px}
.page-h p{color:var(--coffee);margin:6px 0 0}

/* Búsqueda */
.editor{border:1px solid var(--beige-d);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 32px rgba(61,32,16,.08)}
.editor.lleno{border-color:var(--gold);box-shadow:0 4px 32px rgba(196,154,42,.12)}
.editor .bar{background:var(--coffee-d);padding:9px 22px;font-family:var(--mono);font-size:12px;color:var(--gold)}
.editor textarea{width:100%;border:0;outline:none;resize:vertical;min-height:220px;padding:22px 24px 10px;font:inherit;font-size:14.5px;line-height:1.75;color:var(--ink);background:transparent}
.editor .foot{display:flex;justify-content:space-between;gap:10px;padding:12px 24px;border-top:1px solid var(--beige);font-family:var(--mono);font-size:12px;color:var(--coffee-l);flex-wrap:wrap}
.drop{border:2px dashed var(--beige-d);border-radius:14px;padding:20px;text-align:center;background:var(--beige);color:var(--coffee);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-p)}
.file{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--gold-p);border:1px solid var(--beige-d)}

/* Procesamiento */
.steps{border:1px solid var(--beige-d);border-radius:18px;overflow:hidden;background:#fff}
.step{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--beige)}
.step:last-child{border-bottom:0}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--cream);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--beige-d);border:2px solid transparent}
.step.done .dot{background:var(--gold);color:#fff}
.step.cur{background:#FBF8F0}.step.cur .dot{background:var(--beige);border-color:var(--gold)}
.step .sub{font-size:12px;color:var(--coffee-l);margin-top:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);border-top-color:transparent;animation:spin 1s linear infinite;margin-left:auto}
.prog{height:8px;border-radius:99px;background:var(--beige);overflow:hidden}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coffee),var(--gold));transition:width .6s}

/* Pestañas */
.tabs{display:flex;border-bottom:1px solid var(--beige-d);margin:22px 0;overflow-x:auto}
.tabs button{padding:12px 20px;font-size:14px;font-weight:500;color:var(--coffee-l);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--coffee-d);border-color:var(--gold)}

/* Modal y toasts */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--cream);border-radius:20px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.35);animation:fade .2s}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--beige-d);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal pre{margin:0;padding:22px;overflow:auto;white-space:pre-wrap;font-family:var(--sans);font-size:14.5px;line-height:1.8;color:var(--coffee-d);background:#fff;flex:1}
.toasts{position:fixed;right:24px;bottom:24px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--cream);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;min-width:260px;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .25s}

/* Notas */
.nota-bloque{background:var(--gold-p); border-left: 3px solid var(--gold); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; position: relative;}
.nota-bloque button{color: var(--bad); font-size: 13px; cursor: pointer;}

@media(max-width:900px){
  .lmain{flex-direction:column;gap:40px;padding:24px 20px}.hero-img{display:none}.lhead,.lfoot{padding-left:20px;padding-right:20px}
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .side{width:100%;flex-direction:row;align-items:center;overflow-x:auto}
  .side .top{border:0;padding:10px 12px}.side .top .sub,.side .grp,.side .me,.nav .soon{display:none}
  .side nav{display:flex;padding:6px;overflow:visible}.nav{white-space:nowrap;padding:8px 10px;font-size:13px}
  main.content{overflow:visible}.page{padding:18px 16px}
  .between{flex-direction:column}
}
</style>
</head>
<body>
<div id="r"></div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>
<script>
// ════════════════════════════════════════════════════════════════
//  PROTECCIÓN DE RUTA
// ════════════════════════════════════════════════════════════════
const USUARIO_ID = localStorage.getItem('usuario_id');
if (!USUARIO_ID) {
  window.location.href = '/login';
}

// ════════════════════════════════════════════════════════════════
//  ESTADO Y UTILIDADES
// ════════════════════════════════════════════════════════════════
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const OFICIALES = ['cortesuprema.gov.co', 'ramajudicial.gov.co', 'corteconstitucional.gov.co'];
const NIVEL = { A: 'Alta similitud', B: 'Similitud media', C: 'Relevancia jurídica' };
const METODO = { bm25: 'léxica (BM25)', semantica: 'semántica', hibrida: 'híbrida (léxica + semántica)' };

const CASO_DEMO = 'Caso hipotético. Una noche, en una calle del centro de la ciudad, dos personas abordaron a un ciudadano que caminaba solo. Uno de ellos le mostró un cuchillo y le exigió entregar su teléfono celular y su billetera, mientras el otro lo sujetaba por la espalda. La víctima entregó los objetos. Minutos después, la Policía capturó a uno de los dos en un sector cercano con el celular en su poder. El capturado no registra antecedentes penales. En la audiencia de imputación no aceptó cargos. La defensa sostiene que el procesado le compró el celular a un tercero y que no participó en el hecho.';

const S = { v: 'landing', tab: 'similitudes', text: '', file: null, A: null, sel: null, saved: {}, fn: 'todos', estado: null, M: null, running: false, done: false, err: '' };

const $ = id => document.getElementById(id);
const e = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ul = a => (a && a.length) ? '<ul class="l">' + a.map(x => '<li>' + e(x) + '</li>').join('') + '</ul>' : '<p class="muted small">No consta.</p>';
const tags = a => (a || []).map(t => `<span class="badge">${e(t)}</span>`).join(' ');
const pct = x => (x == null ? '—' : Math.round(x * 100) + ' %');
const go = (v, extra = {}) => { Object.assign(S, extra, { v }); render(); const c = document.querySelector('main.content'); if (c) c.scrollTop = 0; scrollTo(0, 0); };

function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  $('toasts').appendChild(d); setTimeout(() => d.remove(), 2600);
}
function urlOficial(u) {
  try { const x = new URL(u); if (!/^https?:$/.test(x.protocol)) return ''; const h = x.hostname.toLowerCase(); return OFICIALES.some(d => h === d || h.endsWith('.' + d)) ? x.href : ''; } catch { return ''; }
}
async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || 'Error del servidor (' + r.status + ')');
  return j;
}

// ════════════════════════════════════════════════════════════════
//  ÍCONOS
// ════════════════════════════════════════════════════════════════
const svg = (p, s = 18, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  search: s => svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>', s),
  upload: s => svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', s),
  folder: s => svg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>', s),
  book: (s, f) => `<svg width="${s || 18}" height="${s || 18}" viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  file: s => svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>', s),
  user: s => svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', s),
  info: s => svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>', s),
  left: s => svg('<path d="M19 12H5M12 5l-7 7 7 7"/>', s),
  right: s => svg('<polyline points="9 18 15 12 9 6"/>', s),
  ext: s => svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>', s)
};

const logo = (dark) => `<div class="logo ${dark ? 'dark' : ''}"><div class="ic">⚖️</div><div><div class="tx">Iuris<em>Search</em></div><div class="sub">Jurisprudencia penal · Colombia</div></div></div>`;
const AVISO = `<div class="note" style="margin-top:22px"><b>Investigar → verificar → comparar → explicar → dejar decidir.</b> Esta herramienta no determina culpabilidad ni inocencia, no recomienda penas y no predice resultados. La valoración y la decisión corresponden exclusivamente al funcionario judicial.</div>`;

// ════════════════════════════════════════════════════════════════
//  MENÚ Y SHELL
// ════════════════════════════════════════════════════════════════
const MENU = [
  ['search', 'Nueva búsqueda', I.search],
  ['saved', 'Jurisprudencias guardadas', s => I.book(s, true)],
  ['docs', 'Mis documentos', I.file],
  ['perfil', 'Mi Perfil', I.user],
  ['about', 'Cómo funciona', I.info]
];

function shell(activo, html) {
  const item = ([k, l, ic]) => `<button class="nav ${activo === k ? 'on' : ''}" onclick="go('${k}')">${ic(18)}<span>${l}</span></button>`;
  return `<div class="app"><aside class="side"><div class="top">${logo(true)}</div>
  <nav><div class="grp">Navegación</div>${MENU.map(m => item(m)).join('')}</nav>
  <div class="me" onclick="go('perfil')" style="cursor:pointer;">
    <div class="av">👤</div>
    <div><div id="nombre-usuario-nav">Cargando...</div><div style="color:rgba(255,255,255,.4);font-size:11px">Ver perfil</div></div>
  </div>
  </aside>
  <main class="content">${html}</main></div>`;
}

function statsPortada() {
  const c = S.estado?.corpus, ev = S.estado?.evaluacion?.metodos;
  const mejor = ev ? Object.values(ev).sort((a, b) => b.recall5 - a.recall5)[0] : null;
  return [
    [c ? c.documentos : '—', 'Sentencias en el corpus'],
    [c ? Object.keys(c.porDelito).length : '—', 'Categorías de delitos'],
    [mejor ? pct(mejor.recall5) : 'Por medir', mejor ? 'Recall@5 · ' + mejor.nombre : 'Recall@5 en casos de prueba']
  ];
}

V.saved = () => shell('saved', `<div class="page"><div class="page-h"><div class="eyebrow">Tu selección rápida</div><h1>Jurisprudencias guardadas</h1><p>Decisiones que has guardado para consulta rápida.</p></div>

    contenedor.innerHTML = '<div class="soft">Aún no has guardado decisiones. Búscalas y pulsa "Guardar".</div>';
    return;
  }

  contenedor.innerHTML = docs.map(doc => {
    const fecha = new Date(doc.guardado_en).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
    
    return `
      <div class="card" style="margin-bottom:10px">
        <div class="between">

// ════════════════════════════════════════════════════════════════
//  UTILIDAD: descarga de Word (usada por varias funciones)
// ════════════════════════════════════════════════════════════════
function descargarWord(htmlContent, nombreArchivo) {
  if (!window.htmlDocx) {
    toast('La librería para generar Word no se cargó. Revisa que /html-docx.min.js exista.');
    return;
  }

  const htmlCompleto = `
    <!DOCTYPE html>
    <html>
      <head><meta charset="utf-8"></head>
      <body>${htmlContent}</body>
    </html>
  `;

  const blob = htmlDocx.asBlob(htmlCompleto);
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo.replace(/[^\w\-]+/g, '_').slice(0, 80) + '.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.URL.revokeObjectURL(url);
  toast('Ficha exportada exitosamente');
}

async function exportarFichaGuardada(sentencia_id) {

    const estilos = `

        body { font-family: 'Arial', sans-serif; font-size: 11pt; color: #333; }

async function analizar() {
  const caso = ((S.text || '') + '\n\n' + (S.file ? S.file.text : '')).trim();
  if (caso.length < 30) return toast('Describe tu caso (mínimo 30 caracteres) o adjunta un documento');
  Object.assign(S, { running: true, done: false, err: '', paso: 0, fn: 'todos', tab: 'similitudes' });
  go('proc');
  const iv = setInterval(() => { if (S.v === 'proc' && S.paso < ETAPAS.length - 1) { S.paso++; render(); } }, 2200);
  try {
    S.A = await api(`/api/analyze?usuario_id=${USUARIO_ID}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caso }) });
    S.done = true;
    if (S.v === 'proc') { render(); setTimeout(() => { if (S.v === 'proc') go('res'); }, 700); }
  } catch (x) { S.err = x.message; if (S.v === 'proc') render(); }
  finally { clearInterval(iv); S.running = false; }
}

function abrir(id) { go('det', { sel: id, tab: 'similitudes' }); }

async function guardar(id) {
  const r = S.A?.resultados.find(x => x.id === id) || S.saved[id];
  if (S.saved[id]) { delete S.saved[id]; toast('Sentencia eliminada de guardadas'); render(); return; }

  S.saved[id] = r;
  toast('Guardando sentencia...');
  
  try {
    const response = await fetch('/api/documentos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario_id: USUARIO_ID,
        sentencia: {
          sentencia_id: r.id, nombre: r.nombre, radicado: r.radicado,
          ponente: r.ponente, fecha: r.fecha, url_oficial: r.url,
          analisis_json: JSON.stringify(r)
        }
      })
    });
    if (response.ok) { toast('Sentencia guardada exitosamente'); setTimeout(() => { go('docs'); }, 1000); } 
    else { toast('Error al guardar la sentencia'); delete S.saved[id]; }
  } catch (e) { console.error(e); toast('Error de conexión'); delete S.saved[id]; }
  render();
}

  $('cnt').textContent = `${n} caracteres · ${p} palabras`;
  const c2 = $('cnt2'); c2.textContent = n > 200 ? '✓ Descripción suficiente' : 'Mínimo recomendado: 200 caracteres'; c2.style.color = n > 200 ? 'var(--ok)' : 'var(--coffee-l)';
  document.querySelector('.editor').classList.toggle('lleno', n > 200);
}

async function leerArchivo(f) {
  if (!f) return;
  toast('Leyendo ' + f.name + '…');
  try {
    let t = '', pg = 1;
    if (/\.pdf$/i.test(f.name)) {
      if (!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF (revisa tu conexión a internet).');
      const d = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; pg = d.numPages;
      for (let p = 1; p <= pg; p++) { const c = await (await d.getPage(p)).getTextContent(); t += c.items.map(x => x.str).join(' ') + '\n'; }
    } else t = await f.text();
    if (t.trim().length < 50) throw new Error('No se encontró texto (¿PDF escaneado?).');
    S.file = { name: f.name, pages: pg, text: t }; render(); toast('Documento cargado');
  } catch (x) { toast(x.message || 'No se pudo leer el archivo'); }
}

function cerrarSesion() {
  if (!confirm('¿Estás seguro de que deseas cerrar sesión?')) return;
  document.cookie = "usuario_id=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
  localStorage.removeItem('usuario_id');
  localStorage.removeItem('usuario_nombre');
  window.location.href = '/login';
}

let vistaAnterior = '';
function render() {
  $('r').innerHTML = (V[S.v] || V.landing)();
  
  if (S.v === 'docs') cargarDocumentosReales();
  if (S.v === 'saved') cargarGuardadas();
  if (S.v === 'perfil') cargarPerfil();

  const nombre = localStorage.getItem('usuario_nombre');
  const navNombre = document.getElementById('nombre-usuario-nav');
  if (navNombre && nombre) navNombre.innerText = nombre;

  vistaAnterior = S.v;
}

api('/api/estado').then(x => { S.estado = x; render(); }).catch(() => {});
render();
</script>
